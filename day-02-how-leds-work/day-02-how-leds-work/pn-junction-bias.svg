<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">p-n Junction: What the + and − Sides Do</text>

  <!-- ================= PANEL 1: NO VOLTAGE ================= -->
  <g transform="translate(10,0)">
    <rect x="5" y="45" width="295" height="370" rx="10" fill="#fafafa" stroke="#ddd"/>
    <text x="152" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">1. No voltage</text>
    <polyline points="20,180 130,180 170,110 285,110" fill="none" stroke="#2563eb" stroke-width="3"/>
    <polyline points="20,270 130,270 170,200 285,200" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="22" y="100" font-size="11" fill="#1e40af">Conduction band</text>
    <text x="200" y="292" font-size="11" fill="#991b1b">Valence band</text>
    <g font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">
      <circle cx="45" cy="169" r="9" fill="#2563eb"/><text x="45" y="173">−</text>
      <circle cx="75" cy="169" r="9" fill="#2563eb"/><text x="75" y="173">−</text>
      <circle cx="105" cy="169" r="9" fill="#2563eb"/><text x="105" y="173">−</text>
    </g>
    <g fill="#fff" stroke="#dc2626" stroke-width="2.5">
      <circle cx="200" cy="211" r="9"/><circle cx="230" cy="211" r="9"/><circle cx="260" cy="211" r="9"/>
    </g>
    <line x1="190" y1="178" x2="190" y2="116" stroke="#333" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <text x="198" y="150" font-size="12" fill="#333">barrier (hill)</text>
    <text x="75" y="315" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">n</text>
    <text x="230" y="315" text-anchor="middle" font-size="18" font-weight="bold" fill="#991b1b">p</text>
    <text x="152" y="355" text-anchor="middle" font-size="13" fill="#333">Electrons can't climb the hill,</text>
    <text x="152" y="373" text-anchor="middle" font-size="13" fill="#333">holes can't cross either.</text>
    <text x="152" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">No current</text>
  </g>

  <!-- ================= PANEL 2: FORWARD BIAS ================= -->
  <g transform="translate(327,0)">
    <rect x="5" y="45" width="295" height="370" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="152" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">2. Forward bias (+ on p)</text>
    <polyline points="20,160 130,160 170,140 285,140" fill="none" stroke="#2563eb" stroke-width="3"/>
    <polyline points="20,250 130,250 170,230 285,230" fill="none" stroke="#dc2626" stroke-width="3"/>
    <g font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">
      <circle cx="40" cy="149" r="9" fill="#2563eb"/><text x="40" y="153">−</text>
      <circle cx="75" cy="149" r="9" fill="#2563eb"/><text x="75" y="153">−</text>
      <circle cx="140" cy="146" r="9" fill="#2563eb"/><text x="140" y="150">−</text>
    </g>
    <line x1="88" y1="149" x2="122" y2="149" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
    <g fill="#fff" stroke="#dc2626" stroke-width="2.5">
      <circle cx="165" cy="238" r="9"/><circle cx="225" cy="241" r="9"/><circle cx="260" cy="241" r="9"/>
    </g>
    <line x1="212" y1="241" x2="182" y2="241" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
    <!-- electron drops into hole -->
    <path d="M145 158 C 160 190, 150 205, 162 226" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ar)"/>
    <!-- photon -->
    <path d="M175 190 q6 -8 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="226,190 216,184 216,196" fill="#f59e0b"/>
    <text x="232" y="186" font-size="13" font-weight="bold" fill="#b45309">photon</text>
    <text x="232" y="202" font-size="13" font-weight="bold" fill="#b45309">= LIGHT</text>
    <text x="75" y="290" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">n</text>
    <text x="230" y="290" text-anchor="middle" font-size="18" font-weight="bold" fill="#991b1b">p</text>
    <text x="152" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">( − battery → n  |  + battery → p )</text>
    <text x="152" y="345" text-anchor="middle" font-size="13" fill="#333">Hill becomes small. Electrons and holes</text>
    <text x="152" y="363" text-anchor="middle" font-size="13" fill="#333">move TOWARD the middle, meet, and the</text>
    <text x="152" y="381" text-anchor="middle" font-size="13" fill="#333">electron drops into the hole → light.</text>
    <text x="152" y="403" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Current flows, LED glows</text>
  </g>

  <!-- ================= PANEL 3: REVERSE BIAS ================= -->
  <g transform="translate(644,0)">
    <rect x="5" y="45" width="295" height="370" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="152" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">3. Reverse bias (− on p)</text>
    <polyline points="20,200 105,200 200,95 285,95" fill="none" stroke="#2563eb" stroke-width="3"/>
    <polyline points="20,280 105,280 200,175 285,175" fill="none" stroke="#dc2626" stroke-width="3"/>
    <g font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">
      <circle cx="35" cy="189" r="9" fill="#2563eb"/><text x="35" y="193">−</text>
      <circle cx="62" cy="189" r="9" fill="#2563eb"/><text x="62" y="193">−</text>
    </g>
    <line x1="98" y1="189" x2="76" y2="189" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
    <g fill="#fff" stroke="#dc2626" stroke-width="2.5">
      <circle cx="222" cy="186" r="9"/><circle cx="247" cy="186" r="9"/>
    </g>
    <line x1="218" y1="207" x2="256" y2="207" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="275" y1="198" x2="275" y2="102" stroke="#333" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <text x="268" y="140" text-anchor="end" font-size="12" fill="#333">big hill</text>
    <!-- depletion zone -->
    <rect x="105" y="230" width="95" height="18" fill="#e5e7eb"/>
    <text x="152" y="243" text-anchor="middle" font-size="11" fill="#444">empty zone grows</text>
    <text x="62" y="302" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">n</text>
    <text x="250" y="302" text-anchor="middle" font-size="18" font-weight="bold" fill="#991b1b">p</text>
    <text x="152" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">( + battery → n  |  − battery → p )</text>
    <text x="152" y="345" text-anchor="middle" font-size="13" fill="#333">Hill becomes bigger. Electrons and holes</text>
    <text x="152" y="363" text-anchor="middle" font-size="13" fill="#333">are pulled AWAY from the middle.</text>
    <text x="152" y="381" text-anchor="middle" font-size="13" fill="#333">They never meet.</text>
    <text x="152" y="403" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Almost no current (tiny leakage)</text>
  </g>
</svg>
