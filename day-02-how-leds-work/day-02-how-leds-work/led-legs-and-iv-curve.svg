<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>

  <!-- ===== LEFT: LED legs + circuit ===== -->
  <text x="210" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">LED Legs &amp; Safe Wiring</text>
  <!-- LED body -->
  <path d="M110 150 L110 95 A35 35 0 0 1 180 95 L180 150 Z" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <rect x="104" y="150" width="82" height="10" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <line x1="186" y1="150" x2="186" y2="160" stroke="#fff" stroke-width="3"/>
  <text x="196" y="160" font-size="11" fill="#555">flat edge = −</text>
  <!-- legs -->
  <line x1="125" y1="160" x2="125" y2="300" stroke="#555" stroke-width="4"/>
  <line x1="165" y1="160" x2="165" y2="250" stroke="#555" stroke-width="4"/>
  <text x="118" y="320" text-anchor="end" font-size="14" font-weight="bold" fill="#991b1b">Long leg</text>
  <text x="118" y="337" text-anchor="end" font-size="13" fill="#991b1b">= anode (+)</text>
  <text x="118" y="354" text-anchor="end" font-size="13" fill="#991b1b">= p side</text>
  <text x="172" y="268" font-size="14" font-weight="bold" fill="#1e40af">Short leg</text>
  <text x="172" y="285" font-size="13" fill="#1e40af">= cathode (−)</text>
  <text x="172" y="302" font-size="13" fill="#1e40af">= n side</text>

  <!-- circuit -->
  <text x="40" y="385" font-size="13" fill="#222">Pin 13 (+)</text>
  <line x1="110" y1="381" x2="140" y2="381" stroke="#333" stroke-width="2"/>
  <path d="M140 381 l6 -8 l10 16 l10 -16 l10 16 l10 -16 l10 16 l6 -8" fill="none" stroke="#333" stroke-width="2"/>
  <text x="170" y="365" text-anchor="middle" font-size="12" fill="#333">resistor</text>
  <line x1="202" y1="381" x2="225" y2="381" stroke="#333" stroke-width="2"/>
  <polygon points="225,369 225,393 247,381" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <line x1="247" y1="369" x2="247" y2="393" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="236" y="410" text-anchor="middle" font-size="12" fill="#333">LED</text>
  <line x1="247" y1="381" x2="275" y2="381" stroke="#333" stroke-width="2"/>
  <text x="280" y="385" font-size="13" fill="#222">GND (−)</text>
  <text x="215" y="210" text-anchor="middle" font-size="12" fill="#555"></text>

  <!-- divider -->
  <line x1="420" y1="20" x2="420" y2="405" stroke="#ccc" stroke-dasharray="5 5"/>

  <!-- ===== RIGHT: I-V curve ===== -->
  <text x="650" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Current vs Voltage (I–V curve)</text>
  <line x1="460" y1="290" x2="850" y2="290" stroke="#333" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="640" y1="390" x2="640" y2="55" stroke="#333" stroke-width="2" marker-end="url(#a2)"/>
  <text x="845" y="312" font-size="15" font-weight="bold" fill="#333">V</text>
  <text x="650" y="62" font-size="15" font-weight="bold" fill="#333">I (current)</text>
  <!-- curve -->
  <path d="M470 293 L640 290 C 700 290, 735 285, 755 240 C 770 205, 778 140, 785 70" fill="none" stroke="#16a34a" stroke-width="3.5"/>
  <!-- annotations -->
  <text x="470" y="110" font-size="13" fill="#166534">+ on p side (forward):</text>
  <text x="470" y="126" font-size="13" fill="#166534">current shoots up</text>
  <text x="470" y="142" font-size="13" fill="#166534">very fast</text>
  <text x="475" y="320" font-size="13" fill="#991b1b">− on p side (reverse):</text>
  <text x="475" y="336" font-size="13" fill="#991b1b">almost zero current,</text>
  <text x="475" y="352" font-size="13" fill="#991b1b">just tiny leakage</text>
  <line x1="740" y1="300" x2="740" y2="280" stroke="#555" stroke-dasharray="3 3"/>
  <text x="740" y="315" text-anchor="middle" font-size="12" fill="#555">turn-on voltage</text>
  <rect x="440" y="360" width="400" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="640" y="378" text-anchor="middle" font-size="13" fill="#78350f">Without a resistor, current gets huge → LED overheats &amp; burns.</text>
  <text x="640" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Always use a current-limiting RESISTOR.</text>
</svg>
